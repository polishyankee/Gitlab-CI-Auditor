workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - security
  - deploy

unit_tests:
  stage: test
  script:
    - bundle exec rspec
  artifacts:
    paths:
      - coverage/jacoco.xml
  rules:
    - if: '$CI_COMMIT_BRANCH'

sast:
  stage: security
  script:
    - semgrep --config auto .
  rules:
    - if: '$CI_COMMIT_BRANCH'

artifact_scan:
  stage: security
  script:
    - trivy fs --exit-code 1 .
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy_test:
  stage: deploy
  environment:
    name: test
  script:
    - kubectl apply -f k8s/test.yaml
  rules:
    - if: '$CI_COMMIT_BRANCH'
