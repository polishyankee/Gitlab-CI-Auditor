workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'

stages:
  - build
  - orchestrate

build_and_test:
  stage: build
  script:
    - mvn -B clean package
  artifacts:
    paths:
      - target/site/jacoco/jacoco.xml
  rules:
    - if: '$CI_COMMIT_BRANCH'

child_security_and_deploy:
  stage: orchestrate
  trigger:
    include:
      - local: downstream_child.yml
  rules:
    - if: '$CI_COMMIT_BRANCH'
