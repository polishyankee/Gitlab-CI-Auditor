workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - security
  - deploy

node_tests:
  stage: test
  script:
    - npm ci
    - npm test
  artifacts:
    paths:
      - coverage/lcov.info

python_tests:
  stage: test
  script:
    - pip install -r requirements.txt
    - pytest
  artifacts:
    paths:
      - coverage/coverage.xml

java_only_sast:
  stage: security
  script:
    - spotbugs -textui build/libs/app.jar

dependency_scan:
  stage: security
  script:
    - trivy fs --exit-code 1 .

deploy_test:
  stage: deploy
  environment:
    name: test
  script:
    - kubectl apply -f k8s/test.yaml
