workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'

stages:
  - build
  - security
  - orchestrate

build_and_test:
  stage: build
  script:
    - mvn -B clean verify cyclonedx:makeAggregateBom
  artifacts:
    paths:
      - target/site/jacoco/jacoco.xml
      - target/bom.cyclonedx.xml

sast:
  stage: security
  script:
    - semgrep --config auto .

dependency_scan:
  stage: security
  script:
    - trivy fs --exit-code 1 .

secret_detection:
  stage: security
  script:
    - gitleaks detect --no-git --exit-code 1 --report-format json --report-path gl-secret-detection-report.json .
  artifacts:
    paths:
      - gl-secret-detection-report.json

handoff_to_delivery:
  stage: orchestrate
  script:
    - echo "handoff to delivery repository"
