workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - security
  - deploy

dotnet_tests:
  stage: test
  script:
    - dotnet test src/App.sln --collect:"XPlat Code Coverage"
  artifacts:
    paths:
      - coverage/cobertura-coverage.xml
  rules:
    - if: '$CI_COMMIT_BRANCH'

dotnet_code_analysis:
  stage: security
  script:
    - dotnet sonarscanner begin /k:"backend"
    - dotnet build src/App.sln
    - dotnet sonarscanner end
  rules:
    - if: '$CI_COMMIT_BRANCH'

node_source_review:
  stage: security
  script:
    - npm ci
    - npx njsscan src/
  rules:
    - if: '$CI_COMMIT_BRANCH'

dependency_scan:
  stage: security
  script:
    - trivy fs --exit-code 1 .
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy_test:
  stage: deploy
  environment:
    name: test
  script:
    - kubectl apply -f k8s/test.yaml
  rules:
    - if: '$CI_COMMIT_BRANCH'
