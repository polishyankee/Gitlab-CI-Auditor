workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'

stages:
  - security
  - deploy

sast_scan:
  stage: security
  script:
    - semgrep --config auto .
  rules:
    - if: '$CI_COMMIT_BRANCH'

artifact_scan:
  stage: security
  script:
    - trivy fs --exit-code 1 .
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy_test:
  stage: deploy
  environment:
    name: test
  script:
    - kubectl apply -f k8s/test.yaml
  rules:
    - if: '$CI_COMMIT_BRANCH'
