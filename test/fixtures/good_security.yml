sast:
  stage: security
  script:
    - semgrep --config auto .
  rules:
    - if: '$CI_COMMIT_BRANCH'

dependency_scan:
  stage: security
  script:
    - trivy fs --exit-code 1 .
  rules:
    - if: '$CI_COMMIT_BRANCH'

secret_detection:
  stage: security
  script:
    - gitleaks detect --no-git --exit-code 1 --report-format json --report-path gl-secret-detection-report.json .
  artifacts:
    paths:
      - gl-secret-detection-report.json
  rules:
    - if: '$CI_COMMIT_BRANCH'

iac_policy:
  stage: security
  script:
    - trivy config --exit-code 1 k8s/
  artifacts:
    paths:
      - trivy-config-report.json
  rules:
    - if: '$CI_COMMIT_BRANCH'

dast:
  stage: deploy
  needs:
    - dependency_scan
  script:
    - zap-baseline.py -t https://qa.example.internal -J gl-dast-report.json
  artifacts:
    paths:
      - gl-dast-report.json
  rules:
    - if: '$CI_COMMIT_BRANCH'
