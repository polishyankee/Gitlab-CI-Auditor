include:
  - local: good_security.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - security
  - deploy

default:
  image: ruby:3.3.0

.unit_template:
  stage: test
  script:
    - bundle exec rspec

unit_tests:
  extends: .unit_template
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy_test:
  stage: deploy
  environment:
    name: test
  script:
    - kubectl apply -f k8s/test.yaml
  rules:
    - if: '$CI_COMMIT_BRANCH'
