name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.2"
          - "3.3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Run unit test suite
        run: ruby -I lib:test test/run_all.rb

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Capture build metadata
        id: meta
        run: |
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: gitlab-ci-auditor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ github.sha }}

      - name: Smoke test CLI image
        run: docker run --rm gitlab-ci-auditor:ci scan /app/examples/pipelines/compliant_service.gitlab-ci.yml

      - name: Smoke test GUI image
        run: |
          docker run -d --rm --name gitlab-ci-auditor-ui -p 4567:4567 gitlab-ci-auditor:ci
          trap 'docker rm -f gitlab-ci-auditor-ui >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4567/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for the GitLab CI auditor UI" >&2
          exit 1
