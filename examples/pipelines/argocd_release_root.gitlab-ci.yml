workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'

stages:
  - build
  - security
  - orchestrate

build_and_test:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn -B clean verify
  artifacts:
    paths:
      - target/site/jacoco/jacoco.xml

sonarqube_scan:
  stage: security
  image: maven:3.9.6-eclipse-temurin-17
  needs: ["build_and_test"]
  script:
    - mvn -B sonar:sonar -Dsonar.host.url=https://sonarqube.example.internal

trivy_dependency:
  stage: security
  image: aquasec/trivy:0.52.2
  needs: ["build_and_test"]
  script:
    - bash ci/trivy.sh
  artifacts:
    paths:
      - gl-dependency-scanning-report.json
      - sbom.cyclonedx.json

secret_detection:
  stage: security
  image: zricethezav/gitleaks:v8.18.4
  script:
    - gitleaks detect --no-git --exit-code 1 --report-format json --report-path gl-secret-detection-report.json .
  artifacts:
    paths:
      - gl-secret-detection-report.json

iac_policy:
  stage: security
  image: openpolicyagent/conftest:v0.56.0
  script:
    - conftest test argocd/app.yaml --output json > conftest-report.json
  artifacts:
    paths:
      - conftest-report.json

deploy_via_argocd:
  stage: orchestrate
  trigger:
    project: platform/argocd-deploy
    file: deploy.gitlab-ci.yml
    branch: main
