workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'

stages:
  - build
  - security
  - orchestrate

build_and_test:
  stage: build
  script:
    - mvn -B clean verify cyclonedx:makeAggregateBom
  artifacts:
    paths:
      - target/site/jacoco/jacoco.xml
      - target/bom.cyclonedx.xml
  rules:
    - if: '$CI_COMMIT_BRANCH'

secret_detection:
  stage: security
  script:
    - gitleaks detect --no-git --exit-code 1 --report-format json --report-path gl-secret-detection-report.json .
  artifacts:
    paths:
      - gl-secret-detection-report.json
  rules:
    - if: '$CI_COMMIT_BRANCH'

external_quality_flow:
  stage: orchestrate
  trigger:
    project: platform/security-child
    file: child.gitlab-ci.yml
    branch: main
  rules:
    - if: '$CI_COMMIT_BRANCH'
