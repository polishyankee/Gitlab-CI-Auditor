stages:
  - deploy

deploy_test:
  stage: deploy
  image: argoproj/argocd:v2.11.3
  environment:
    name: test
  script:
    - bash scripts/argocd-sync.sh

dast:
  stage: deploy
  needs:
    - deploy_test
  script:
    - zap-baseline.py -t https://test.example.internal -J gl-dast-report.json
  artifacts:
    paths:
      - gl-dast-report.json
